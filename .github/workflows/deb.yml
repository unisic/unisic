name: Debian package

# Reusable single source of truth for the .deb. Builds it and uploads it as the
# `unisic-deb` artifact. Called by:
#   - build.yml   -> PR smoke check: does the package still build and install?
#   - release.yml -> produces the published release asset.
# Keeping it here (not duplicated) means the PR check tests the exact build the
# release uses, so the two can never drift.
on:
  workflow_call:
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  BUILD_TYPE: Release
  UNISIC_BUILD_NUMBER: ${{ github.run_number }}

jobs:
  deb:
    name: Debian package
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          # Unisic has no optional dependencies: every -dev package below backs
          # a gate CMakeLists.txt refuses to configure without, and the
          # assert-gates step checks that the configure really found all ten.
          # Drop one and the build stops naming it, instead of shipping a
          # binary whose UI offers a feature the code does not contain.
          #
          # The awkward one is HAVE_KWIN_SCREENCAST (KWin-native recording, no
          # portal share dialog). It needs Qt6WaylandClient plus the protocol
          # scanner (qt6-wayland-dev, which pulls qt6-wayland-dev-tools),
          # plasma-wayland-protocols for zkde-screencast-unstable-v1.xml, and
          # the private QPA header for the per-screen wl_output. Trixie ships
          # NO Qt6GuiPrivateConfig.cmake at all - qt6-base-private-dev is
          # headers only, and sid moved the config into qt6-base-dev - so
          # find_package(Qt6 COMPONENTS GuiPrivate) fails here and used to take
          # the whole feature with it: the released .deb fell back to the
          # portal on every Plasma desktop.
          # That gap is closed in the kit rather than worked around here.
          # external/unisic-kit tries the GuiPrivate component first and, when
          # it is absent, find_path()s qpa/qplatformnativeinterface.h under the
          # Qt6Gui include dirs. qt6-base-private-dev below is what that
          # fallback consumes, so it is now load-bearing on Debian 13 rather
          # than installed on speculation.
          apt-get install -y --no-install-recommends \
            ca-certificates git cmake ninja-build g++ pkg-config dpkg-dev file \
            qt6-base-dev qt6-declarative-dev qt6-svg-dev qt6-wayland \
            qt6-wayland-dev qt6-base-private-dev plasma-wayland-protocols \
            qt6-tools-dev qt6-l10n-tools \
            libpipewire-0.3-dev \
            libtesseract-dev libleptonica-dev libzxing-dev \
            liblayershellqtinterface-dev libwayland-dev libkf6guiaddons-dev \
            libx11-dev libxext-dev libxfixes-dev libxcb1-dev \
            libinput-dev libudev-dev

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: |
          cmake -B build-deb -G Ninja \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
            -DCPACK_GENERATOR=DEB

      - name: Check every build gate is on
        # Split out of the build step so a gate that ended up OFF is named
        # before the compile, and so the Debian 13 GuiPrivate fallback above is
        # verified by a machine rather than assumed: if it ever stops working,
        # HAVE_KWIN_SCREENCAST reads absent here instead of the .deb silently
        # going back to the portal.
        uses: ./.github/actions/assert-gates
        with:
          build-dir: build-deb

      - name: Build DEB
        run: |
          cmake --build build-deb --parallel
          cpack --config build-deb/CPackConfig.cmake -G DEB -B dist
          dpkg-deb --field dist/*.deb Depends Recommends
          # Install gate. Deliberately WITHOUT --no-install-recommends, unlike
          # the build-dependency install above: apt honours Recommends by
          # default, so that is what a user's `apt install ./unisic.deb`
          # actually pulls, and this gate exists to prove that resolves. The
          # Recommends is the xdg-desktop-portal-* alternation (a backend has
          # several mutually exclusive providers, so it cannot be a Depends);
          # skipping it here would have tested a set of packages nobody gets.
          apt-get install -y ./dist/*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: unisic-deb
          path: dist/*.deb
          if-no-files-found: error
