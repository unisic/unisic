name: Nix flake

# Verifies the Nix packaging without anyone needing Nix locally: builds the
# package, which compiles Unisic and runs the headless QtTest suite in its
# checkPhase. Runs on the throwaway `nix-flake` branch and on demand.
on:
  push:
    branches: [nix-flake]
    paths:
      - flake.nix
      - flake.lock
      - nix/**
      - .github/workflows/nix.yml
  workflow_dispatch:
  # Called by build.yml so a PR test-builds this packaging path too.
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Nix (flakes enabled)
        uses: DeterminateSystems/nix-installer-action@main

      - name: Build the package (compiles Unisic + runs the QtTest suite)
        # ?submodules=1 is not optional: a plain `nix build .#unisic` copies the
        # parent tree's tracked content into the store, and a submodule is a
        # gitlink there, not content. external/unisic-kit would arrive EMPTY and
        # CMakeLists' add_subdirectory would fail - which it did, even though
        # this job checks out with submodules: recursive.
        run: nix build '.?submodules=1#unisic' -L
