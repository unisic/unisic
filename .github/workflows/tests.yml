name: Tests

# The cheap gate that fires on EVERY push. build.yml only runs on pull
# requests and builds the whole AppImage (~15 min), so between releases
# nothing was compiling the tree or running ctest at all - the ten QtTest
# targets in tests/ existed but no machine ever ran them.
#
# This job compiles the full app and then runs ctest. Unisic has no optional
# dependencies, so "the full app" is the only app there is: every gate is a
# hard build requirement and a missing -dev package stops the configure rather
# than quietly removing a feature. Qt and the source-built KDE libs are cached,
# so a warm run is a compile plus half a second of tests.
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

# A newer push to the same branch cancels the still-running check of the
# previous commit - only the newest commit's result matters.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # Pinned so the source-built prefix cache key is stable and a bumped tag
  # invalidates it by itself.
  QT_VERSION: "6.8.3"
  ECM_TAG: v6.10.0
  LAYERSHELL_TAG: v6.3.5
  KGUIADDONS_TAG: v6.10.0
  PLASMA_PROTOCOLS_TAG: v1.16.0

jobs:
  ctest:
    name: Build + unit tests
    # Same runner as the release AppImage build, so a green run here means
    # the toolchain that ships is the toolchain that was tested. Moved off
    # ubuntu-22.04 with the AppImage: GitHub starts failing jobs on that image
    # deliberately during its brownout, and it was also the reason half the
    # dependencies below had to be built from source.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install host dependencies
        run: |
          sudo apt-get update
          # Every dependency the tree probes for is installed, because every
          # one of them is mandatory: a missing package here is a configure
          # error, not a quietly narrower build.
          # extra-cmake-modules is deliberately NOT taken from apt: noble ships
          # 5.115 and the KDE libs below need ECM 6.10, so it is built into
          # the same local prefix they are.
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config \
            libpipewire-0.3-dev \
            libtesseract-dev libleptonica-dev libzxing-dev \
            libinput-dev libudev-dev \
            libx11-dev libxext-dev libxfixes-dev libxcb1-dev \
            libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libwayland-dev wayland-protocols

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          cache: true

      - name: Restore the source-built KDE prefix
        id: optprefix
        uses: actions/cache@v4
        with:
          path: lsq-prefix
          key: optprefix-noble-${{ runner.os }}-qt${{ env.QT_VERSION }}-ecm${{ env.ECM_TAG }}-lsq${{ env.LAYERSHELL_TAG }}-kga${{ env.KGUIADDONS_TAG }}-pwp${{ env.PLASMA_PROTOCOLS_TAG }}

      - name: Build the KDE libs Ubuntu 24.04 has no usable package for
        # Three gates would otherwise have no dependency to find, and since
        # every gate is now mandatory that is a failed configure, not a
        # narrower build:
        #   HAVE_LAYERSHELL      on-top notification card, overlay over a
        #                        fullscreen window, preview pin
        #   HAVE_KGUIADDONS      Klipper clipboard history (issue #51)
        #   HAVE_KWIN_SCREENCAST KWin-native recording (no portal dialog)
        # Noble has no KF6 at all (no libkf6guiaddons-dev) and its
        # layer-shell-qt is the Qt5 build (5.27), neither of which can serve a
        # Qt 6.8 app; its plasma-wayland-protocols is 1.10, which clears the
        # kit's >= 1.7 floor but not the >= 1.15 that kguiaddons
        # $KGUIADDONS_TAG requires. So all four are built once and cached - a
        # warm run restores the prefix and skips this step.
        if: steps.optprefix.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$ECM_TAG" https://invent.kde.org/frameworks/extra-cmake-modules.git
          cmake -S extra-cmake-modules -B build-ecm -G Ninja \
            -DCMAKE_INSTALL_PREFIX="$PWD/lsq-prefix" \
            -DBUILD_TESTING=OFF -DBUILD_DOC=OFF \
            -DBUILD_MAN_DOCS=OFF -DBUILD_HTML_DOCS=OFF -DBUILD_QTHELP_DOCS=OFF
          cmake --install build-ecm
          # plasma-wayland-protocols is XML plus a tiny cmake config, nothing to
          # compile. It carries zkde-screencast-unstable-v1.xml, which the kit
          # generates its KWin-native recording client from, and kguiaddons
          # refuses to configure without >= 1.15.0 - so it is installed before
          # both of them.
          git clone --depth 1 --branch "$PLASMA_PROTOCOLS_TAG" https://invent.kde.org/libraries/plasma-wayland-protocols.git
          cmake -S plasma-wayland-protocols -B build-pwp -G Ninja \
            -DCMAKE_PREFIX_PATH="$PWD/lsq-prefix" \
            -DCMAKE_INSTALL_PREFIX="$PWD/lsq-prefix" \
            -DKDE_INSTALL_LIBDIR=lib -DCMAKE_INSTALL_LIBDIR=lib
          cmake --install build-pwp
          git clone --depth 1 --branch "$LAYERSHELL_TAG" https://invent.kde.org/plasma/layer-shell-qt.git
          cmake -S layer-shell-qt -B build-lsq -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/lsq-prefix" \
            -DCMAKE_INSTALL_PREFIX="$PWD/lsq-prefix" \
            -DKDE_INSTALL_LIBDIR=lib -DCMAKE_INSTALL_LIBDIR=lib \
            -DBUILD_TESTING=OFF
          cmake --build build-lsq --parallel
          cmake --install build-lsq
          git clone --depth 1 --branch "$KGUIADDONS_TAG" https://invent.kde.org/frameworks/kguiaddons.git
          cmake -S kguiaddons -B build-kga -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/lsq-prefix" \
            -DCMAKE_INSTALL_PREFIX="$PWD/lsq-prefix" \
            -DKDE_INSTALL_LIBDIR=lib -DCMAKE_INSTALL_LIBDIR=lib \
            -DBUILD_TESTING=OFF
          cmake --build build-kga --parallel
          cmake --install build-kga

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: tests-noble-${{ runner.os }}-qt${{ env.QT_VERSION }}

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/lsq-prefix" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Check every build gate is on
        # A stale ccache/prefix restore or a gate added to CMakeLists.txt and
        # nowhere else would leave this job covering less code than it claims,
        # and green - the exact way HAVE_ONNX was off in every shipped package
        # for months. The shared action reads the manifest CMake writes, so
        # this check is the same check every packaging job runs.
        uses: ./.github/actions/assert-gates
        with:
          build-dir: build

      - name: Build
        run: cmake --build build --parallel

      - name: Run unit tests
        env:
          # The tests construct QGuiApplication and QQuickPaintedItem items;
          # the runner has no display server.
          QT_QPA_PLATFORM: offscreen
        # --no-tests=error: if a refactor ever stops registering the test
        # targets, an empty ctest run must fail rather than report success.
        run: ctest --test-dir build --output-on-failure --no-tests=error

  i18n:
    name: Translations complete
    # CLAUDE.md makes this a hard requirement: lrelease bakes the .qm into
    # the qrc, so an unfinished or empty <translation> ships as a silent
    # fallback to English. Nothing enforced it before this job.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Fail on unfinished or empty translations
        run: |
          status=0
          for f in i18n/unisic_*.ts; do
            unfinished="$(grep -c 'type="unfinished"' "$f" || true)"
            empty="$(grep -c '<translation></translation>' "$f" || true)"
            if [ "$unfinished" != "0" ] || [ "$empty" != "0" ]; then
              echo "::error file=$f::$unfinished unfinished and $empty empty translations - fill them before merging"
              status=1
            fi
          done
          [ "$status" = "0" ] && echo "all seven .ts files are complete"
          exit "$status"
