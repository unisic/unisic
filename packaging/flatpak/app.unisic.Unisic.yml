id: app.unisic.Unisic
runtime: org.kde.Platform
runtime-version: "6.11"
sdk: org.kde.Sdk
command: unisic

# Every hole here is one Unisic actually uses; the portals cover the rest.
# Screenshots and screen recording go through xdg-desktop-portal (Screenshot,
# ScreenCast) and file dialogs through the FileChooser portal, so none of those
# need a static permission.
finish-args:
  - --share=ipc
  - --socket=wayland
  # X11 session support (XShm capture, the XWayland record-border and
  # notification helpers). Unisic is Wayland-first but runs on Xorg too.
  - --socket=fallback-x11
  # Hardware video encoding (VAAPI/NVENC) and GPU rendering of the overlay.
  - --device=dri
  # Upload destinations and the "new version available" check.
  - --share=network
  # Sound cues, plus microphone and system audio in recordings.
  - --socket=pulseaudio
  # Per-application audio picker enumerates PipeWire nodes. The ScreenCast
  # stream itself arrives as a portal fd and needs no socket of its own.
  - --filesystem=xdg-run/pipewire-0
  # Default save locations (Settings can point elsewhere through the portal).
  - --filesystem=xdg-pictures:create
  - --filesystem=xdg-videos:create
  # The pressed-key badge and the click ripple read /dev/input event devices
  # through the bundled libinput. Without this the devices are simply not there.
  - --device=input
  # ...and libinput's udev backend needs the host udev database to see the
  # ID_INPUT_* properties that tell a keyboard from a touchpad. Without it the
  # feature builds, opens no device and reports "no permission", which is a
  # worse answer than being absent: the user is told to fix something that is
  # not theirs to fix. Read-only, and only the database.
  - --filesystem=/run/udev:ro
  # Tray icon (StatusNotifierItem) and capture notifications: the filtered
  # session bus hides both names, which would leave the app with no tray entry
  # and no feedback after a capture.
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications
  # Global capture hotkeys on KDE Plasma. Every other desktop goes through
  # org.freedesktop.portal.GlobalShortcuts, which needs no static permission.
  - --talk-name=org.kde.kglobalaccel
  # Self-grants the Screenshot portal permission once, so the overlay freeze
  # does not raise a portal dialog on every single capture. Spectacle and
  # Flameshot take the same route; without it a screenshot tool is unusable.
  - --talk-name=org.freedesktop.impl.portal.PermissionStore
  # The bundled tesseract resolves language data from /app (the sandbox cannot
  # see host langpacks, and /app is read-only at runtime).
  - --env=TESSDATA_PREFIX=/app/share/tessdata

cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /lib/*.a
  - /lib/*.la
  - /share/man
  - /share/doc
  # CLI front ends of the bundled libraries; Unisic links the libraries.
  - /bin/tesseract
  - /bin/x264
  - /bin/libinput
  - /libexec/libinput
  - /bin/mtdev-test
  - /bin/touchpad-edge-detector
  - /bin/mouse-dpi-tool
  - /bin/libevdev-tweak-device
  # curl-config is a build-time helper for whoever links libcurl; nothing in
  # the sandbox does. The curl BINARY stays, that is the point of the module.
  - /bin/curl-config
  # libinput's udev rules and hwdb are for the HOST's udev to apply, and the
  # host applied its own long before the sandbox opened. /share/libinput is
  # deliberately NOT cleaned: libinput reads its .quirks files from there at
  # context creation and refuses to start a context without them.
  - /lib/udev
  # Native-packaging leftovers with no meaning inside the sandbox: the second,
  # legacy icon name (flatpak only exports app-ID-prefixed files) and the OBS
  # repository signing key the .deb/.rpm postinst uses.
  - /share/icons/hicolor/scalable/apps/unisic.svg
  - /share/unisic/obs-signing-key.asc

modules:
  # H.264 encoder for MP4 recordings and for the lossless intermediate the GIF
  # pipeline records into. The runtime's own ffmpeg is built without it (and
  # without any software H.264 encoder), so MP4 would only work on machines
  # with a VAAPI-capable GPU. Unisic is GPL-3.0-or-later, so the GPL build of
  # x264 and ffmpeg is fine here.
  - name: x264
    config-opts:
      - --enable-shared
      - --disable-cli
      - --disable-opencl
    sources:
      - type: git
        url: https://code.videolan.org/videolan/x264.git
        commit: 31e19f92f00c7003fa115047ce50978bc98c3a0d
        x-checker-data:
          type: git
          tag-pattern: ^stable$

  # Unisic drives the ffmpeg CLI: frames piped into an encoder, two-pass
  # palettegen/paletteuse for GIF, VAAPI for MP4 where the GPU offers it, the
  # pulse input for microphone and system audio, and the segment muxer for the
  # instant-replay ring. The default component set is kept deliberately: a
  # hand-picked --disable-everything list is one forgotten filter away from a
  # feature that fails at runtime, where nothing here would catch it. Only the
  # external libraries are chosen.
  - name: ffmpeg
    config-opts:
      - --prefix=/app
      - --disable-static
      - --enable-shared
      - --disable-debug
      - --disable-doc
      - --disable-ffplay
      - --enable-gpl
      - --enable-version3
      # H.264 for MP4 and for the lossless libx264rgb intermediate.
      - --enable-libx264
      # WebM.
      - --enable-libvpx
      - --enable-libopus
      # Hardware encoding when the GPU has it (--device=dri).
      - --enable-vaapi
      # `-f pulse` capture of microphone and system audio.
      - --enable-libpulse
    sources:
      - type: archive
        url: https://ffmpeg.org/releases/ffmpeg-7.1.5.tar.xz
        # Debian's orig tarball is the upstream file verbatim (same sha256) -
        # ffmpeg.org resets connections from GitHub's runners often enough to
        # fail two CI builds in a row, and the checksum keeps the fallback as
        # trustworthy as the origin. The x-checker bumps only `url`, so refresh
        # this mirror path by hand on each ffmpeg bump.
        mirror-urls:
          - https://deb.debian.org/debian/pool/main/f/ffmpeg/ffmpeg_7.1.5.orig.tar.xz
        sha256: de668509caf9e35e3cd162473441fdb29538c6d96ed080292b3cf9e6fc5d558f
        x-checker-data:
          type: anitya
          project-id: 5405
          stable-only: true
          url-template: https://ffmpeg.org/releases/ffmpeg-$version.tar.xz

  # OCR ("copy text out of a region"). Neither leptonica nor tesseract is in
  # the runtime, and HAVE_TESSERACT is a hard build requirement, so without
  # these two modules the unisic module does not configure at all. That is the
  # intent: a channel that cannot carry a dependency must fail loudly here
  # rather than ship a build with a feature quietly missing.
  - name: leptonica
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_PROG=OFF
      - -DSW_BUILD=OFF
    sources:
      - type: archive
        url: https://github.com/DanBloomberg/leptonica/releases/download/1.85.0/leptonica-1.85.0.tar.gz
        sha256: 3745ae3bf271a6801a2292eead83ac926e3a9bc1bf622e9cd4dd0f3786e17205

  - name: tesseract
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TRAINING_TOOLS=OFF
      - -DDISABLE_CURL=ON
    sources:
      - type: archive
        url: https://github.com/tesseract-ocr/tesseract/archive/refs/tags/5.5.0.tar.gz
        sha256: f2fb34ca035b6d087a42875a35a7a5c4155fa9979c6132365b1e5a28ebc3fc11

  # Language data for the bundled tesseract. The sandbox cannot read host
  # langpacks and /app is read-only at runtime, so the shipped languages are
  # the languages OCR can offer.
  # osd is not a language: it is the orientation-and-script model behind
  # OcrEngine::scriptDetectionAvailable(), which Settings turns on by default.
  # Without the file that switch is on and does nothing, in every Flatpak.
  # It costs 10 MB, the largest single file in the bundle, and it is the only
  # non-language traineddata we ship.
  - name: tessdata
    buildsystem: simple
    build-commands:
      - install -Dm644 eng.traineddata /app/share/tessdata/eng.traineddata
      - install -Dm644 pol.traineddata /app/share/tessdata/pol.traineddata
      - install -Dm644 osd.traineddata /app/share/tessdata/osd.traineddata
    sources:
      - type: file
        url: https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/4.1.0/eng.traineddata
        sha256: 7d4322bd2a7749724879683fc3912cb542f19906c83bcc1a52132556427170b2
      - type: file
        url: https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/4.1.0/pol.traineddata
        sha256: c4476cdbc0e33d898d32345122b7be1cbf85ace15f920f06c7714756e1ef79b2
      - type: file
        url: https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/4.1.0/osd.traineddata
        sha256: 9cf5d576fcc47564f11265841e5ca839001e7e6f38ff7f7aacf46d15a96b00ff

  # QR and barcode payloads inside the OCR path.
  - name: zxing-cpp
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_EXAMPLES=OFF
      - -DBUILD_BLACKBOX_TESTS=OFF
      - -DBUILD_UNIT_TESTS=OFF
    sources:
      - type: archive
        url: https://github.com/zxing-cpp/zxing-cpp/archive/refs/tags/v2.2.1.tar.gz
        sha256: 02078ae15f19f9d423a441f205b1d1bee32349ddda7467e2c84e8f08876f8635

  # Clipboard reliability on Wayland: copies are mirrored through wl-copy when
  # it is present, and the runtime does not ship it.
  - name: wl-clipboard
    buildsystem: meson
    config-opts:
      # Auto-detected completion dirs resolve outside /app and fail to install.
      - -Dzshcompletiondir=no
      - -Dfishcompletiondir=no
    sources:
      - type: archive
        url: https://github.com/bugaevc/wl-clipboard/archive/refs/tags/v2.2.1.tar.gz
        sha256: 6eb8081207fb5581d1d82c4bcd9587205a31a3d47bea3ebeb7f41aa1143783eb

  # SFTP and SCP upload destinations. The runtime does ship curl, but its
  # libcurl links no SSH backend at all (readelf on the Platform's
  # libcurl.so.4 lists openssl, nghttp2, psl and zlib, and nothing else), so
  # every sftp:// and scp:// destination the destination editor offers would
  # fail inside the sandbox with an unsupported-protocol error. Two shapes
  # would fix that; this is the safer one. Building a SHARED curl would put
  # /app/lib/libcurl.so.4 ahead of the runtime's on the loader path for every
  # other consumer in the sandbox, Qt's network stack included, and a bundled
  # TLS-adjacent library that nobody audits ages badly. --disable-shared keeps
  # the module down to one private /app/bin/curl, which is all UploadManager
  # spawns, and /app/bin precedes /usr/bin so it is the one that gets found.
  # libssh2 is static for the same reason: it exists only inside that binary.
  - name: libssh2
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=OFF
      - -DBUILD_EXAMPLES=OFF
      - -DBUILD_TESTING=OFF
    sources:
      - type: archive
        url: https://libssh2.org/download/libssh2-1.11.1.tar.xz
        sha256: 9954cb54c4f548198a7cbebad248bdc87dd64bd26185708a294b2b50771e3769

  - name: curl
    config-opts:
      # No libcurl.so in /app: see the note above. The static archive is a
      # build-time artifact and the global cleanup drops it with /lib/*.a.
      - --disable-shared
      - --enable-static
      - --with-openssl
      - --with-libssh2
      - --disable-manual
      # Unisic only ever speaks HTTP(S), FTP(S), SFTP and SCP through this
      # binary. LDAP pulls in a whole extra library for a protocol no upload
      # destination can name, and libpsl only matters to a cookie jar we do
      # not use.
      - --disable-ldap
      - --disable-ldaps
      - --without-libpsl
    sources:
      - type: archive
        url: https://curl.se/download/curl-8.15.0.tar.xz
        sha256: 6cd0a8a5b126ddfda61c94dc2c3fc53481ba7a35461cf7c5ab66aa9d6775b609

  # HAVE_LAYERSHELL: the styled notification card, the capture overlay above
  # fullscreen windows and the pinned preview. Neither the Platform nor the
  # Sdk ships it and the gate is a hard build requirement, so this module is
  # what lets the unisic module configure at all. The runtime fallback is a
  # separate matter: on a compositor that does not implement the protocol
  # those three paths take the XWayland helper route instead, which works.
  - name: layer-shell-qt
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF
    sources:
      - type: archive
        url: https://download.kde.org/stable/plasma/6.7.3/layer-shell-qt-6.7.3.tar.xz
        sha256: 51924fa14d05320eacef8defea51895c96117bc89dd709e74536dd8ecdfb4581
        x-checker-data:
          type: anitya
          project-id: 240630
          stable-only: true
          url-template: https://download.kde.org/stable/plasma/$version/layer-shell-qt-$version.tar.xz

  # HAVE_LIBINPUT, the last gate this channel was missing. It drives the
  # pressed-key badge and the click ripple drawn over a recording, and it is
  # now a hard build requirement like every other gate: without these three
  # modules the unisic module fails at configure time instead of shipping a
  # bundle where both features are silently absent, which is what every
  # Flatpak released so far did.
  # Only half the pair is in the runtime. libudev comes from the Platform
  # (systemd-libs), libinput does not, and neither do its own dependencies, so
  # they are built here in dependency order: libevdev first (libinput needs it
  # to read evdev devices at all), then mtdev, then libinput itself.
  # Bundling is also not the whole fix on this channel: see --device=input and
  # --filesystem=/run/udev:ro in finish-args, without which libinput builds,
  # opens nothing and reports "no permission".
  - name: libevdev
    config-opts:
      - --disable-static
      # The doc build wants doxygen, which is not in the Sdk, and nothing in
      # the bundle would read the output anyway.
      - --disable-documentation
    sources:
      - type: archive
        url: https://www.freedesktop.org/software/libevdev/libevdev-1.13.6.tar.xz
        sha256: 73f215eccbd8233f414737ac06bca2687e67c44b97d2d7576091aa9718551110

  # Protocol-A multitouch devices (older touchpads) speak a format libinput
  # reads only through mtdev. It is optional upstream, but leaving it out
  # would make the badge and the ripple miss exactly the hardware that is
  # hardest for the user to guess at, so device coverage here matches what the
  # distro packages give.
  - name: mtdev
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: https://bitmath.org/code/mtdev/mtdev-1.1.7.tar.bz2
        sha256: a107adad2101fecac54ac7f9f0e0a0dd155d954193da55c2340c97f2ff1d814e

  # libinput publishes no release tarballs any more, so the source is the tag
  # plus the commit it resolves to, the same shape the unisic module uses.
  # libwacom is off: it identifies tablets, and Unisic only ever asks whether a
  # device is a keyboard or a pointer. The udev directory is pinned inside
  # /app so the install cannot land outside the prefix; the rules it writes are
  # for the HOST's udev and are dropped again by the cleanup list.
  - name: libinput
    buildsystem: meson
    config-opts:
      - -Dlibwacom=false
      - -Dmtdev=true
      - -Ddebug-gui=false
      - -Dtests=false
      - -Ddocumentation=false
      - -Dlua-plugins=disabled
      - -Dzshcompletiondir=no
      - -Dudev-dir=/app/lib/udev
    sources:
      - type: git
        url: https://gitlab.freedesktop.org/libinput/libinput.git
        tag: 1.31.3
        commit: 26191d396d74d505541d6311f0b4ae68d791b890
        x-checker-data:
          type: git
          tag-pattern: ^([\d.]+)$

  - name: unisic
    buildsystem: cmake-ninja
    builddir: true
    # flatpak-builder runs cmake in a cleaned environment, so the release
    # defaults are pinned by hand: otherwise CMakeLists.txt flips
    # UNISIC_DEV_BUILD to ON and the bundle would ship the Developer tab and
    # the F8 smoke test.
    build-options:
      env:
        UNISIC_BUILD_NUMBER: ""
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/app
      - -DUNISIC_DEV_BUILD=OFF
    post-install:
      # ../LICENSE, not LICENSE: builddir: true runs every command of this
      # module from _flatpak_build, and the license sits in the source root.
      - install -Dm644 ../LICENSE /app/share/licenses/app.unisic.Unisic/LICENSE
    sources:
      - type: git
        url: https://github.com/unisic/unisic.git
        tag: v0.8.1
        commit: 66ec650fcf2458cbbf50fc9d9ffe81e132272b4d
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
